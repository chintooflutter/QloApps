version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"          # Map container port 80 to host 8080
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mealvilla
      DB_USER: mealvilla_user
      DB_PASSWORD: mealvilla_password
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      - db
    volumes:
      - ./:/var/www/html   # Sync current directory with container
    restart: unless-stopped

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mealvilla
      MYSQL_USER: mealvilla_user
      MYSQL_PASSWORD: mealvilla_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"       # Optional: expose MySQL for local use
    restart: unless-stopped

volumes:
  db_data:
